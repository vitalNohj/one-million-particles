  <style>
    * { box-sizing: border-box; }
    body { position: relative; font-family: 'Times New Roman', Times, serif; width: 100vw; height: 100vh; margin: 0; padding: 0; background-color: #021119; color: #d7d7d7; overflow: hidden; }
    canvas { width: 100%; height: 100%; }
    .guide { position: absolute; bottom: 10%; left: 0; display: flex; width: 100%; flex-direction: column; justify-content: center; align-items: center; font-size: 14px; z-index: 1; }
    .title { position: absolute; width: 100%; top: 5%; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 10px; }
    .title p { margin: 0; opacity: 0.5; }
    .source { margin-top: 16px; font-size: 12px; letter-spacing: 0.03em; }
    .source * { margin: 0 6px 0; }
    .source, .source a { display: flex; align-items: center; }
    .source a { opacity: 0.6; color: #d7d7d7; border-bottom: 1px dotted #d7d7d7; text-decoration: none; }
    .source a:hover { opacity: 1; }
    .dot { opacity: 0.6; }
    .mouse { display: flex; }
    .gestures { display: none; }
    .mouse, .gestures { align-items: center; }
    .mouse div, .gestures div { display: flex; margin: 0 10px; align-items: center; }
    .mouse span, .gestures span { margin-left: 8px; opacity: 0.4; }
    .mouse svg, .gestures svg { opacity: 0.3; width: 20px; height: auto; }
    .gestures svg { opacity: 0.4; margin-bottom: 4px; }
    .controls { position: absolute; top: 20px; right: 20px; background-color: rgba(2, 17, 25, 0.8); padding: 16px; border-radius: 8px; border: 1px solid rgba(215, 215, 215, 0.2); z-index: 10; min-width: 200px; }
    .controls h3 { margin: 0 0 12px 0; font-size: 14px; font-weight: normal; opacity: 0.8; }
    .controls-group { margin-bottom: 16px; }
    .controls-group:last-child { margin-bottom: 0; }
    .controls-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    .controls-label span { opacity: 0.6; }
    .controls-slider { width: 100%; margin-bottom: 8px; }
    .controls-input { width: 100%; background-color: rgba(215, 215, 215, 0.1); border: 1px solid rgba(215, 215, 215, 0.3); color: #d7d7d7; padding: 6px 8px; border-radius: 4px; font-size: 14px; font-family: 'Times New Roman', Times, serif; }
    .controls-input:focus { outline: none; border-color: rgba(215, 215, 215, 0.6); }
    .controls-textarea { width: 100%; background-color: rgba(215, 215, 215, 0.1); border: 1px solid rgba(215, 215, 215, 0.3); color: #d7d7d7; padding: 6px 8px; border-radius: 4px; font-size: 14px; font-family: 'Times New Roman', Times, serif; resize: vertical; min-height: 60px; }
    .controls-textarea:focus { outline: none; border-color: rgba(215, 215, 215, 0.6); }
    .controls-checkbox { display: flex; align-items: center; margin-top: 8px; font-size: 12px; }
    .controls-checkbox input[type="checkbox"] { margin-right: 8px; }
    @media only screen and (hover: none) {
      .guide { bottom: 15% }
      .mouse { display: none; }
      .gestures { display: flex; }
      .controls { top: 10px; right: 10px; padding: 12px; min-width: 180px; }
    }
  </style>

  <script id="fboPositionVertexShader" type="x-shader/x-vertex">
    void main() {
      gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
    }
  </script>

  <script id="fboPositionFragmentShader" type="x-shader/x-fragment">
    uniform sampler2D uOriginalPositionsTexture;
    uniform sampler2D uPositionsTexture;
    uniform sampler2D uVelocitiesTexture;
    uniform vec2 uTextureResolution;
    uniform vec3 uPointer;
    uniform vec3 uPointerStart;
    uniform float uNoiseFrequency;
    uniform float uNoiseAmplitude;
    uniform float uTime;
    uniform float uDeltaTime;

    ${noise}
    
    void main() {
      vec2 uv = gl_FragCoord.xy / uTextureResolution;
      vec3 originalPosition = texture2D(uOriginalPositionsTexture, uv).rgb;
      vec3 position = texture2D(uPositionsTexture, uv).rgb;
      vec4 velocity = texture2D(uVelocitiesTexture, uv).rgba;
      vec3 diffPosition = originalPosition - position;
      float diffPositionLength = clamp(length(diffPosition), 0.0, 1.0);

      position += curlNoise(originalPosition + uTime * uNoiseFrequency) * uNoiseAmplitude;
      position += velocity.xyz * uDeltaTime;

      gl_FragColor = vec4(position, length(diffPosition));
    }
  </script>

  <script id="fboVelocityVertexShader" type="x-shader/x-vertex">
    void main() {
      gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
    }
  </script>

  <script id="fboVelocityFragmentShader" type="x-shader/x-fragment">
    uniform sampler2D uOriginalPositionsTexture;
    uniform sampler2D uPositionsTexture;
    uniform sampler2D uVelocitiesTexture;
    uniform vec2 uTextureResolution;
    uniform vec3 uPointer;
    uniform vec3 uPointerStart;
    
    void main() {
      vec2 uv = gl_FragCoord.xy / uTextureResolution;
      vec3 originalPosition = texture2D(uOriginalPositionsTexture, uv).rgb;
      vec3 position = texture2D(uPositionsTexture, uv).rgb;
      vec4 velocity = texture2D(uVelocitiesTexture, uv).rgba;
  
      // if pointer hits a particle
      vec3 diffToPointer = position - uPointer;    
      float pointerDiffLength = distance(uPointer, uPointerStart);
      float distanceToPointer = length(position.xy - uPointer.xy);
      float isHit = 1.0 - smoothstep(0.0, 1.0, distanceToPointer);
      
      // find target position
      vec3 target = originalPosition + normalize(diffToPointer) * clamp(pow(2.5, pointerDiffLength * 4.0), 1.0, 100.0) * isHit;
      
      // move that position
      velocity.xyz = target - position; 

      gl_FragColor = vec4(velocity.xyz, 1.0);
    }
  </script>


  <script type="module">
    import * as  THREE from "three";
    import { TextGeometry } from "three/addons/TextGeometry.js";
    import { FontLoader } from "three/addons/FontLoader.js";
    import * as BufferGeometryUtils from "three/addons/BufferGeometryUtils.js";
    import { OrbitControls } from "three/addons/OrbitControls.js";
    import { MeshSurfaceSampler } from "three/addons/MeshSurfaceSampler.js";
    import noise from "./libs/noise";

    // text scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, window.innerWidth < 500 ? 76 : window.innerWidth < 980 ? 46 : 26);

    // fbo scene
    const fboScene = new THREE.Scene();
    const fboCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1 / Math.pow(2, 53), 1);
    
    // fbo config - will be set dynamically
    let fboWidth = 1000;
    let fboHeight = 1000;
    let COUNT = fboWidth * fboHeight;
    
    // Current particle count (user-controlled)
    let currentParticleCount = 1000000;
    
    // uniforms
    const textUniforms = {
      uWatermarbleTexture: { value: null },
      uPositionsTexture: { value: null },
      uVelocitiesTexture: { value: null },
    };
    const fboUniforms = {
      uOriginalPositionsTexture: { value: null },
      uPositionsTexture: { value: null },
      uVelocitiesTexture: { value: null },
      uTextureResolution: { value: new THREE.Vector2(fboWidth, fboHeight) },
      uPointer: { value: new THREE.Vector3() },
      uPointerStart: { value: new THREE.Vector3() },
      uNoiseFrequency: { value: 0.15 },
      uNoiseAmplitude: { value: 0.002 },
      uTime: { value: 0 },
      uDeltaTime: { value: 0 },
      uComeBack: { value: 0 },
    };

    // fbo shaders
    // text shaders are written in literal string further down below
    const fboPositionVertexShader = document.getElementById("fboPositionVertexShader").textContent;
    const fboPositionFragmentShader = document.getElementById("fboPositionFragmentShader").textContent.replace("${noise}", noise);
    const fboVelocityVertexShader = document.getElementById("fboVelocityVertexShader").textContent;
    const fboVelocityFragmentShader = document.getElementById("fboVelocityFragmentShader").textContent;

    // water marble texture
    new THREE.TextureLoader().load("./assets/watermarble.jpg", function (watermarbleTexture) {
      watermarbleTexture.wrapS = THREE.RepeatWrapping;
      watermarbleTexture.wrapT = THREE.RepeatWrapping;
      textUniforms.uWatermarbleTexture.value = watermarbleTexture;
    });

    // lights
    const directionalLight = new THREE.DirectionalLight(0xFFFFFF, 1);
    directionalLight.position.set(-1, 2, 3);
    const ambientLight = new THREE.AmbientLight(0xFFFFFF, 1);
    scene.add(directionalLight);
    scene.add(ambientLight);

    // text
    const textGeometry = new THREE.BufferGeometry();
    const textMaterial = new THREE.PointsMaterial({ size: 0.04, opacity: 0.6, transparent: true });
    const text = new THREE.Points(textGeometry, textMaterial);
    text.position.set(0, 0.5, 0);
    text.material.onBeforeCompile = function (shader) {
      shader.uniforms = {
        ...shader.uniforms,
        ...textUniforms,
      }
      shader.vertexShader = `
        uniform sampler2D uPositionsTexture;
        varying vec2 vUv;
        varying float vTemperature;
        ${shader.vertexShader}
      `.replace(
        "#include <begin_vertex>",
        `
          #include <begin_vertex>
          transformed = texture2D(uPositionsTexture, position.xy).rgb;
          vTemperature = texture2D(uPositionsTexture, position.xy).a;
          vUv = uv;
        `
      );
      shader.fragmentShader = `
        uniform sampler2D uWatermarbleTexture;
        varying float vTemperature;
        varying vec2 vUv;
        ${shader.fragmentShader}    
      `.replace(
        "vec4 diffuseColor = vec4( diffuse, opacity );",
        `
          vec3 watermarbleTexture = texture2D(uWatermarbleTexture, vUv).xyz;
          vec3 highlightColor = vec3(0.3, 0.6, 1.0);
          vec3 fincalColor = mix(watermarbleTexture, highlightColor, (vTemperature / 1.5));
          vec4 diffuseColor = vec4( fincalColor, opacity );
        `
      )
    }

    // fbo mesh
    const fboMeshGeometry = new THREE.BufferGeometry();
    const fboPlaneGeometryPositions = new Float32Array([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, -1, 0, 1, 1, 0, -1, 1, 0]);
    fboMeshGeometry.setAttribute("position", new THREE.BufferAttribute(fboPlaneGeometryPositions, 3));
    const fboMeshMaterial = new THREE.ShaderMaterial({ uniforms: fboUniforms });
    const fboMesh = new THREE.Mesh(fboMeshGeometry, fboMeshMaterial);
    fboScene.add(fboMesh);

    // fbo render targets - will be initialized dynamically
    let fboPositionRenderTarget1 = null;
    let fboPositionRenderTarget2 = null;
    let fboVelocityRenderTarget1 = null;
    let fboVelocityRenderTarget2 = null;
    
    // Function to calculate optimal texture dimensions for a given particle count
    function calculateTextureDimensions(count) {
      // Calculate square root and round up to ensure we have enough space
      const side = Math.ceil(Math.sqrt(count));
      // Round to nearest reasonable GPU-friendly size (not necessarily power of 2, but close)
      return {
        width: side,
        height: side
      };
    }
    
    // Function to create FBO render targets with given dimensions
    function createFBORenderTargets(width, height) {
      const options = {
        minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter,
        format: THREE.RGBAFormat,
        type: THREE.FloatType,
      };
      
      const rt1 = new THREE.WebGLRenderTarget(width, height, options);
      const rt2 = new THREE.WebGLRenderTarget(width, height, options);
      const rt3 = new THREE.WebGLRenderTarget(width, height, options);
      const rt4 = new THREE.WebGLRenderTarget(width, height, options);
      
      return {
        position1: rt1,
        position2: rt2,
        velocity1: rt3,
        velocity2: rt4
      };
    }
    
    // Function to dispose of FBO render targets
    function disposeFBORenderTargets() {
      if (fboPositionRenderTarget1) {
        fboPositionRenderTarget1.dispose();
        fboPositionRenderTarget1 = null;
      }
      if (fboPositionRenderTarget2) {
        fboPositionRenderTarget2.dispose();
        fboPositionRenderTarget2 = null;
      }
      if (fboVelocityRenderTarget1) {
        fboVelocityRenderTarget1.dispose();
        fboVelocityRenderTarget1 = null;
      }
      if (fboVelocityRenderTarget2) {
        fboVelocityRenderTarget2.dispose();
        fboVelocityRenderTarget2 = null;
      }
    }

    const fontConfig = {
      font: null,
      size: 3,
      depth: 1,
      bevelThickness: 0,
      bevelSize: 0.01,
      bevelEnabled: true,
    }
    
    // Current text state
    let currentText = "1,000,000\nPARTICLES";
    let isRuntimeMode = true;
    let isUpdatingText = false;
    
    // Function to process text input and create geometry from multi-line text
    function processTextInput(text) {
      if (!fontConfig.font) {
        console.warn("Font not loaded yet");
        return null;
      }
      
      const lines = text.split('\n').filter(line => line.trim().length > 0);
      if (lines.length === 0) {
        return null;
      }
      
      const geometries = [];
      const lineHeight = fontConfig.size * 1.2; // Spacing between lines
      let totalHeight = 0;
      const lineGeometries = [];
      
      // Create geometry for each line
      for (let i = 0; i < lines.length; i++) {
        const lineGeometry = new TextGeometry(lines[i], fontConfig);
        lineGeometries.push({ geometry: lineGeometry, index: i });
      }
      
      // Calculate total height and center vertically
      let maxWidth = 0;
      for (const { geometry } of lineGeometries) {
        geometry.computeBoundingBox();
        const width = geometry.boundingBox.max.x - geometry.boundingBox.min.x;
        const height = geometry.boundingBox.max.y - geometry.boundingBox.min.y;
        maxWidth = Math.max(maxWidth, width);
        totalHeight += height;
      }
      totalHeight += (lines.length - 1) * lineHeight;
      
      // Position each line vertically
      let currentY = totalHeight / 2;
      for (const { geometry, index } of lineGeometries) {
        geometry.computeBoundingBox();
        const height = geometry.boundingBox.max.y - geometry.boundingBox.min.y;
        const offset = new THREE.Vector3(0, currentY - height / 2, 0);
        
        for (let i = 0; i < geometry.attributes.position.count; i++) {
          const i3 = i * 3;
          geometry.attributes.position.array[i3 + 0] += offset.x;
          geometry.attributes.position.array[i3 + 1] += offset.y;
          geometry.attributes.position.array[i3 + 2] += offset.z;
        }
        geometry.attributes.position.needsUpdate = true;
        
        currentY -= (height + lineHeight);
        geometries.push(geometry);
      }
      
      // Merge all line geometries
      if (geometries.length === 0) return null;
      const mergedGeometry = geometries.length === 1 
        ? geometries[0] 
        : BufferGeometryUtils.mergeGeometries(geometries);
      
      return mergedGeometry;
    }
    
    // Initialize text geometry - full reset path
    function initializeTextGeometry(inputText, particleCount) {
      if (isUpdatingText) return;
      isUpdatingText = true;
      
      // Calculate texture dimensions for the desired particle count
      const dims = calculateTextureDimensions(particleCount);
      fboWidth = dims.width;
      fboHeight = dims.height;
      COUNT = fboWidth * fboHeight;
      
      // Update texture resolution uniform
      fboUniforms.uTextureResolution.value.set(fboWidth, fboHeight);
      
      // Process text input to create geometry
      const mergedGeometry = processTextInput(inputText);
      if (!mergedGeometry) {
        isUpdatingText = false;
        return;
      }
      
      // Create a temporary mesh for surface sampling
      const tempTextMesh = new THREE.Mesh(mergedGeometry, new THREE.MeshBasicMaterial());
      tempTextMesh.geometry.computeBoundingBox();
      const textWidth = tempTextMesh.geometry.boundingBox.max.x - tempTextMesh.geometry.boundingBox.min.x;
      const textHeight = tempTextMesh.geometry.boundingBox.max.y - tempTextMesh.geometry.boundingBox.min.y;
      
      // Center the text mesh for sampling
      tempTextMesh.position.x = -textWidth / 2;
      tempTextMesh.position.y = -textHeight / 2;
      tempTextMesh.position.z = 0;

      const surfaceSampler = new MeshSurfaceSampler(tempTextMesh).build();
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(COUNT * 3);
      const uvs = new Float32Array(COUNT * 2);
      const fboPositionData = new Float32Array(COUNT * 4);
      const fboVelocityData = new Float32Array(COUNT * 4);

      const tempPosition = new THREE.Vector3();
      for (let i = 0; i < COUNT; i++) {
        const i2 = i * 2;
        const i3 = i * 3;
        const i4 = i * 4;
        
        // sample a position from the surface of the text
        surfaceSampler.sample(tempPosition);
        const [x, y, z] = tempPosition;

        // initialize the position and velocity for fbo
        fboPositionData[i4 + 0] = x;
        fboPositionData[i4 + 1] = y;
        fboPositionData[i4 + 2] = z;

        // set particles position on the texture
        positions[i3 + 0] = (i % fboWidth) / fboWidth;
        positions[i3 + 1] = ~~(i / fboWidth) / fboHeight;
        positions[i3 + 2] = 0;
        
        // calculate uv based on text's width and height
        const xlength = x - tempTextMesh.geometry.boundingBox.min.x;
        const ylength = y - tempTextMesh.geometry.boundingBox.min.y;
        uvs[i2 + 0] = xlength / textWidth;
        uvs[i2 + 1] = ylength / textHeight;
      }
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));

      // Full reset - recreate all textures
      fboMesh.material.uniforms.uOriginalPositionsTexture.value = new THREE.DataTexture(
          new Float32Array(fboPositionData),
          fboWidth, fboHeight, THREE.RGBAFormat, THREE.FloatType
        );
      fboMesh.material.uniforms.uOriginalPositionsTexture.value.needsUpdate = true;
      
      fboMesh.material.uniforms.uPositionsTexture.value = new THREE.DataTexture(
          new Float32Array(fboPositionData),
          fboWidth, fboHeight, THREE.RGBAFormat, THREE.FloatType
        );
      fboMesh.material.uniforms.uPositionsTexture.value.needsUpdate = true;

      fboMesh.material.uniforms.uVelocitiesTexture.value = new THREE.DataTexture(
        fboVelocityData,
        fboWidth, fboHeight, THREE.RGBAFormat, THREE.FloatType
      );
      fboMesh.material.uniforms.uVelocitiesTexture.value.needsUpdate = true;

      textUniforms.uPositionsTexture.value = fboMesh.material.uniforms.uPositionsTexture.value;
      
      // Update the global text Points object
      text.geometry = geometry;
      text.geometry.computeBoundingSphere();
      text.geometry.boundingSphere.radius = 1000;
      text.position.set(0, 0.5, 0);
      
      // Clean up temporary mesh
      tempTextMesh.geometry.dispose();
      tempTextMesh.material.dispose();
      
      isUpdatingText = false;
    }
    
    // Update text at runtime - smooth transition path
    function updateTextRuntime(newText, particleCount) {
      if (isUpdatingText) return;
      isUpdatingText = true;
      
      // Calculate texture dimensions for the desired particle count
      const dims = calculateTextureDimensions(particleCount);
      const newFboWidth = dims.width;
      const newFboHeight = dims.height;
      const newCount = newFboWidth * newFboHeight;
      
      // If particle count changed, we need to do full initialization
      if (newFboWidth !== fboWidth || newFboHeight !== fboHeight) {
        isUpdatingText = false;
        initializeTextGeometry(newText, particleCount);
        return;
      }
      
      // Update texture resolution uniform if needed
      if (fboWidth !== newFboWidth || fboHeight !== newFboHeight) {
        fboUniforms.uTextureResolution.value.set(newFboWidth, newFboHeight);
      }
      
      // Process text input to create geometry
      const mergedGeometry = processTextInput(newText);
      if (!mergedGeometry) {
        isUpdatingText = false;
        return;
      }
      
      // Create temporary text mesh for sampling
      const tempTextMesh = new THREE.Mesh(mergedGeometry, new THREE.MeshBasicMaterial());
      tempTextMesh.geometry.computeBoundingBox();
      const textWidth = tempTextMesh.geometry.boundingBox.max.x - tempTextMesh.geometry.boundingBox.min.x;
      const textHeight = tempTextMesh.geometry.boundingBox.max.y - tempTextMesh.geometry.boundingBox.min.y;
      
      // Center the text
      tempTextMesh.position.x = -textWidth / 2;
      tempTextMesh.position.y = -textHeight / 2;
      tempTextMesh.position.z = 0;

      const surfaceSampler = new MeshSurfaceSampler(tempTextMesh).build();
      const fboPositionData = new Float32Array(COUNT * 4);

      const tempPosition = new THREE.Vector3();
      for (let i = 0; i < COUNT; i++) {
        const i4 = i * 4;
        
        // sample a position from the surface of the new text
        surfaceSampler.sample(tempPosition);
        const [x, y, z] = tempPosition;

        // Store new target positions
        fboPositionData[i4 + 0] = x;
        fboPositionData[i4 + 1] = y;
        fboPositionData[i4 + 2] = z;
        fboPositionData[i4 + 3] = 0;
      }
      
      // Update only the original positions texture (target positions)
      // Keep current positions and velocities for smooth animation
      fboMesh.material.uniforms.uOriginalPositionsTexture.value = new THREE.DataTexture(
          new Float32Array(fboPositionData),
          fboWidth, fboHeight, THREE.RGBAFormat, THREE.FloatType
        );
      fboMesh.material.uniforms.uOriginalPositionsTexture.value.needsUpdate = true;
      
      // Note: We don't update text.geometry in runtime mode because it contains
      // the particle texture coordinates. The particles will animate to new positions
      // via the shader, but the underlying particle geometry stays the same.
      
      // Clean up temporary mesh
      tempTextMesh.geometry.dispose();
      tempTextMesh.material.dispose();
      
      isUpdatingText = false;
    }
    
    // Legacy function for backward compatibility
    function setTextGeometry(particleCount) {
      initializeTextGeometry(currentText, particleCount);
    }
    
    // Function to initialize render targets with data from DataTextures
    function initializeRenderTargets() {
      // Temporarily set uPositionsTexture to original positions for initialization
      const originalPositionsTexture = fboMesh.material.uniforms.uOriginalPositionsTexture.value;
      const originalVelocitiesTexture = fboMesh.material.uniforms.uVelocitiesTexture.value;
      
      // Copy position data from DataTexture to render target
      // Use position shader but set uPositionsTexture to original so it just copies
      fboMesh.material.uniforms.uPositionsTexture.value = originalPositionsTexture;
      fboMesh.material.vertexShader = fboPositionVertexShader;
      fboMesh.material.fragmentShader = fboPositionFragmentShader;
      fboMesh.material.needsUpdate = true;
      renderer.setRenderTarget(fboPositionRenderTarget1);
      renderer.clear();
      renderer.render(fboScene, fboCamera);
      fboMesh.material.uniforms.uPositionsTexture.value = fboPositionRenderTarget1.texture;
      
      // Initialize velocity render target (should be zero/empty initially)
      fboMesh.material.vertexShader = fboVelocityVertexShader;
      fboMesh.material.fragmentShader = fboVelocityFragmentShader;
      fboMesh.material.needsUpdate = true;
      renderer.setRenderTarget(fboVelocityRenderTarget1);
      renderer.clear();
      renderer.render(fboScene, fboCamera);
      fboMesh.material.uniforms.uVelocitiesTexture.value = fboVelocityRenderTarget1.texture;
      
      renderer.setRenderTarget(null);
      textUniforms.uPositionsTexture.value = fboMesh.material.uniforms.uPositionsTexture.value;
    }
    
    // Function to update particle count and regenerate system
    let isUpdatingParticleCount = false;
    function updateParticleCount(newCount) {
      if (isUpdatingParticleCount) return;
      
      // Validate count
      newCount = Math.max(1000, Math.min(1000000, Math.floor(newCount)));
      
      if (newCount === currentParticleCount) return;
      
      isUpdatingParticleCount = true;
      currentParticleCount = newCount;
      
      // Dispose old render targets
      disposeFBORenderTargets();
      
      // Regenerate geometry and textures with new count
      initializeTextGeometry(currentText, newCount);
      
      // Create new render targets with new dimensions
      const targets = createFBORenderTargets(fboWidth, fboHeight);
      fboPositionRenderTarget1 = targets.position1;
      fboPositionRenderTarget2 = targets.position2;
      fboVelocityRenderTarget1 = targets.velocity1;
      fboVelocityRenderTarget2 = targets.velocity2;
      
      // Initialize render targets with data
      initializeRenderTargets();
      
      // Update UI display
      const displayElement = document.getElementById('particleCountDisplay');
      if (displayElement) {
        displayElement.textContent = newCount.toLocaleString();
      }
      
      isUpdatingParticleCount = false;
    }
    
    // Function to update text
    function updateText(newText) {
      if (!newText || newText.trim().length === 0) return;
      if (newText === currentText) return;
      
      currentText = newText;
      
      if (isRuntimeMode) {
        updateTextRuntime(newText, currentParticleCount);
      } else {
        // Full initialization mode
        disposeFBORenderTargets();
        initializeTextGeometry(newText, currentParticleCount);
        const targets = createFBORenderTargets(fboWidth, fboHeight);
        fboPositionRenderTarget1 = targets.position1;
        fboPositionRenderTarget2 = targets.position2;
        fboVelocityRenderTarget1 = targets.velocity1;
        fboVelocityRenderTarget2 = targets.velocity2;
        initializeRenderTargets();
      }
    }
    
    // URL parameter parsing function (called before font loads to set initial text)
    function parseURLParameters() {
      const urlParams = new URLSearchParams(window.location.search);
      const textParam = urlParams.get('text');
      if (textParam) {
        const decodedText = decodeURIComponent(textParam);
        currentText = decodedText;
      }
    }
    
    // Parse URL parameters immediately (before font loads)
    parseURLParameters();
    
    const fontLoader = new FontLoader();
    fontLoader.load("./assets/font.json", function (font) {
      fontConfig.font = font;
      
      // Update text input if URL parameter was set (textInput will be available in event handlers)
      
      initializeTextGeometry(currentText, currentParticleCount);
      
      // Initialize render targets after geometry is set
      const targets = createFBORenderTargets(fboWidth, fboHeight);
      fboPositionRenderTarget1 = targets.position1;
      fboPositionRenderTarget2 = targets.position2;
      fboVelocityRenderTarget1 = targets.velocity1;
      fboVelocityRenderTarget2 = targets.velocity2;
      
      // Initialize render targets with data
      initializeRenderTargets();
    });
        
    scene.add(text);

    const canvas = document.querySelector("canvas");
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPerformance: "high-performance",
      canvas,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x021119);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.touches = {
      TWO: THREE.TOUCH.DOLLY_ROTATE
    };
    orbitControls.update();

    // plane to capture mouse position
    const raycasterPlaneGeometry = new THREE.PlaneGeometry(100, 100);
    const raycasterPlaneMaterial = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, depthTest: false, depthWrite: false });
    const raycasterPlane = new THREE.Mesh(raycasterPlaneGeometry, raycasterPlaneMaterial);
    raycasterPlane.position.set(0, 0, 0.5);
    raycasterPlane.visible = false;
    scene.add(raycasterPlane);

    // raycaster
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function onPointerMove(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
	    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }
    let pointerStartCountdown = 0;
    
    // clock
    const clock = new THREE.Clock();
    
    function render() {
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();
      
      // fbo - check if render targets are initialized
      if (!fboPositionRenderTarget1 || !fboPositionRenderTarget2 || 
          !fboVelocityRenderTarget1 || !fboVelocityRenderTarget2) {
        return requestAnimationFrame(render);
      }
      if (!fboMesh.material.uniforms.uPositionsTexture.value) return requestAnimationFrame(render);
      if (!fboMesh.material.uniforms.uVelocitiesTexture.value) return requestAnimationFrame(render);
      const temp = fboVelocityRenderTarget1;
      fboVelocityRenderTarget1 = fboVelocityRenderTarget2;
      fboVelocityRenderTarget2 = temp;
      fboMesh.material.vertexShader = fboVelocityVertexShader;
      fboMesh.material.fragmentShader = fboVelocityFragmentShader;
      fboMesh.material.needsUpdate = true;
      renderer.setRenderTarget(fboVelocityRenderTarget1);
      renderer.clear();
      renderer.render(fboScene, fboCamera);
      fboMesh.material.uniforms.uVelocitiesTexture.value = fboVelocityRenderTarget1.texture;
      const temp2 = fboPositionRenderTarget1;
      fboPositionRenderTarget1 = fboPositionRenderTarget2;
      fboPositionRenderTarget2 = temp2;
      fboMesh.material.vertexShader = fboPositionVertexShader;
      fboMesh.material.fragmentShader = fboPositionFragmentShader;
      fboMesh.material.needsUpdate = true;
      renderer.setRenderTarget(fboPositionRenderTarget1);
      renderer.clear();
      renderer.render(fboScene, fboCamera);
      fboMesh.material.uniforms.uPositionsTexture.value = fboPositionRenderTarget1.texture;
      renderer.setRenderTarget(null);
      textUniforms.uPositionsTexture.value = fboMesh.material.uniforms.uPositionsTexture.value;

      fboMesh.material.uniforms.uTime.value = time;
      fboMesh.material.uniforms.uDeltaTime.value = delta;
      
      // raycaster
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects([raycasterPlane]);
      if (intersects[0]) {
        fboMesh.material.uniforms.uPointer.value = intersects[0].point.clone().sub(text.position);
      }
      if (pointerStartCountdown <= 0) {
        fboMesh.material.uniforms.uPointerStart.value = fboMesh.material.uniforms.uPointer.value;
        pointerStartCountdown = 10;
      } else {
        pointerStartCountdown -= 1;
      }
      
      renderer.render(scene, camera);
      orbitControls.update();
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("resize", onWindowResize);

    function onWindowResize(){
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        camera.position.z = window.innerWidth < 500 ? 76 : window.innerWidth < 980 ? 46 : 26;
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // UI Event Handlers for particle count controls
    const particleCountSlider = document.getElementById('particleCountSlider');
    const particleCountInput = document.getElementById('particleCountInput');
    const particleCountDisplay = document.getElementById('particleCountDisplay');
    
    let updateTimeout = null;
    function debouncedUpdateParticleCount(count) {
      if (updateTimeout) {
        clearTimeout(updateTimeout);
      }
      updateTimeout = setTimeout(() => {
        updateParticleCount(count);
      }, 300); // 300ms debounce
    }
    
    function formatNumber(num) {
      return num.toLocaleString();
    }
    
    if (particleCountSlider && particleCountInput) {
      // Slider change handler
      particleCountSlider.addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        particleCountInput.value = value;
        particleCountDisplay.textContent = formatNumber(value);
        debouncedUpdateParticleCount(value);
      });
      
      // Input change handler
      particleCountInput.addEventListener('input', (e) => {
        let value = parseInt(e.target.value);
        if (isNaN(value)) value = currentParticleCount;
        value = Math.max(1000, Math.min(1000000, value));
        particleCountSlider.value = value;
        particleCountInput.value = value;
        particleCountDisplay.textContent = formatNumber(value);
        debouncedUpdateParticleCount(value);
      });
      
      // Input blur handler (apply on blur if user typed something)
      particleCountInput.addEventListener('blur', (e) => {
        let value = parseInt(e.target.value);
        if (isNaN(value)) value = currentParticleCount;
        value = Math.max(1000, Math.min(1000000, value));
        particleCountSlider.value = value;
        particleCountInput.value = value;
        particleCountDisplay.textContent = formatNumber(value);
        updateParticleCount(value); // Immediate update on blur
      });
    }
    
    // UI Event Handlers for text controls
    const textInput = document.getElementById('textInput');
    const runtimeModeCheckbox = document.getElementById('runtimeModeCheckbox');
    
    // Update text input if URL parameter was set
    if (textInput && currentText !== "1,000,000\nPARTICLES") {
      textInput.value = currentText;
    }
    
    let textUpdateTimeout = null;
    function debouncedUpdateText(text) {
      if (textUpdateTimeout) {
        clearTimeout(textUpdateTimeout);
      }
      textUpdateTimeout = setTimeout(() => {
        updateText(text);
      }, 500); // 500ms debounce for text input
    }
    
    if (textInput) {
      // Text input change handler
      textInput.addEventListener('input', (e) => {
        const value = e.target.value;
        debouncedUpdateText(value);
      });
      
      // Text input blur handler (immediate update on blur)
      textInput.addEventListener('blur', (e) => {
        const value = e.target.value;
        if (textUpdateTimeout) {
          clearTimeout(textUpdateTimeout);
          textUpdateTimeout = null;
        }
        updateText(value);
      });
    }
    
    if (runtimeModeCheckbox) {
      // Runtime mode checkbox handler
      runtimeModeCheckbox.addEventListener('change', (e) => {
        isRuntimeMode = e.target.checked;
      });
    }
    
    // Public API function
    window.updateParticleText = function(text, options = {}) {
      const mode = options.mode || (isRuntimeMode ? 'runtime' : 'init');
      const particleCount = options.particleCount || currentParticleCount;
      
      // Update mode if specified
      if (options.mode === 'runtime' || options.mode === 'init') {
        isRuntimeMode = (options.mode === 'runtime');
        if (runtimeModeCheckbox) {
          runtimeModeCheckbox.checked = isRuntimeMode;
        }
      }
      
      // Update particle count if specified
      if (options.particleCount && options.particleCount !== currentParticleCount) {
        updateParticleCount(particleCount);
      }
      
      // Update text
      if (text && text !== currentText) {
        currentText = text;
        if (textInput) {
          textInput.value = text;
        }
        
        if (mode === 'runtime') {
          updateTextRuntime(text, particleCount);
        } else {
          disposeFBORenderTargets();
          initializeTextGeometry(text, particleCount);
          const targets = createFBORenderTargets(fboWidth, fboHeight);
          fboPositionRenderTarget1 = targets.position1;
          fboPositionRenderTarget2 = targets.position2;
          fboVelocityRenderTarget1 = targets.velocity1;
          fboVelocityRenderTarget2 = targets.velocity2;
          initializeRenderTargets();
        }
      }
    };
    
  </script>
</html>
